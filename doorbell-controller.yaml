# Board: Generic ESP32-C6 Board (Generic)
# Definition: definitions/boards/generic-esp32c6/manifest.yaml


# RELAY 

esphome:
  name: doorbell-controller
  friendly_name: Doorbell controller

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: doorbell-contro Fallback Hotspot
    password: !secret wifi_password

captive_portal:

## 5V is also available for the doorbel button. Connect 5V to IN1 or IN2
# 1. Button inputs
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true # Zorgt dat 'true' (AAN) wordt doorgegeven als je de knop indrukt naar GND
    name: "Doorbell Button 1"
    id: fysical_button_1
    filters:
      - delayed_on: 20ms # Ontdender-filter (voorkomt dat de bel 2x gaat door een slechte knop)
      - delayed_off: 1000ms
        # Zodra de fysieke knop wordt ingedrukt, activeert hij de Home Assistant button hieronder
    on_press:
      then:
        - button.press: doorbell_sequence_1
        - logger.log:
            format: "Input1 (Doorbell) state to: Pressed"
          
  - platform: gpio
    pin:
      number: GPIO06
      mode: INPUT_PULLUP
      inverted: true # Zorgt dat 'true' (AAN) wordt doorgegeven als je de knop indrukt naar GND
    name: "Doorbell Button 2"
    id: fysical_button_2
    filters:
      - delayed_on: 20ms # Ontdender-filter (voorkomt dat de bel 2x gaat door een slechte knop)
      - delayed_off: 1000ms
        # Zodra de fysieke knop wordt ingedrukt, activeert hij de Home Assistant button hieronder
    on_press:
      then:
        - button.press: doorbell_sequence_2
        - logger.log:
            format: "Input2 (Doorbell) state to: Pressed"

          
# 2. Home Assistant inputs / sequences
button:
  - platform: template
    name: "Doorbell Sound 1"
    id: doorbell_sequence_1
    icon: "mdi:doorbell-video"
    # Deze actie wordt nu getriggerd door ZOWEL Home Assistant als de fysieke knop!
    on_press:
      then:
        # Eerste Ding
        - switch.turn_on: doorbell_relay
        - delay: 350ms
        - switch.turn_off: doorbell_relay
        - delay: 500ms
        # Tweede Ding
        - switch.turn_on: doorbell_relay
        - delay: 350ms
        - switch.turn_off: doorbell_relay
        - delay: 500ms
        # Derde Ding
        - switch.turn_on: doorbell_relay
        - delay: 350ms
        - switch.turn_off: doorbell_relay
        - logger.log:
            format: "Sequence 1 (Doorbell) state to: Played"
          
  - platform: template
    name: "Doorbell Sound 2"
    id: doorbell_sequence_2
    icon: "mdi:doorbell-video"
    # Deze actie wordt nu getriggerd door ZOWEL Home Assistant als de fysieke knop!
    on_press:
      then:
        # Eerste Ding
        - switch.turn_on: doorbell_relay
        - delay: 350ms
        - switch.turn_off: doorbell_relay
        - delay: 500ms
        # Tweede Ding
        - switch.turn_on: doorbell_relay
        - delay: 350ms
        - switch.turn_off: doorbell_relay
        - delay: 500ms
        # Derde Ding
        - switch.turn_on: doorbell_relay
        - delay: 350ms
        - switch.turn_off: doorbell_relay
        - logger.log:
            format: "Sequence 2 (Doorbell) state to: Played"
          
# 3. Het Hardware Relais (Output)
switch:
  - platform: gpio
    pin: GPIO19
    id: doorbell_relay
    internal: true # Houdt de losse schakelaar verborgen in Home Assistant
    restore_mode: ALWAYS_OFF



# https://documentation.espressif.com/esp32-c6-wroom-1_wroom-1u_datasheet_en.pdf

# ===================================================================
#              ESP32-C6-WROOM-1-N4 MODULE PINOUT (CORRECT)
# ===================================================================

# [Pin]   [Naam]     [Type]      [Hoofdfunctie / Alternatieve functies]
# -------------------------------------------------------------------
#  1       GND        Power       Ground (Massa)                          TOP LEFT (antenna)
#  2       3V3        Power       Voeding (3.3V)
#  3       EN         Input       Chip Enable / Reset (Actief Hoog)
#  4       IO4        I/O         GPIO4  / ADC1_CH4 / MTMS (JTAG)
#  5       IO5        I/O         GPIO5  / ADC1_CH5 / MTDI (JTAG)
#  6       IO6        I/O         GPIO6  / MTCK (JTAG)
#  7       IO7        I/O         GPIO7  / MTDO (JTAG)
#  8       IO0        I/O         GPIO0  / ADC1_CH0
#  9       IO1        I/O         GPIO1  / ADC1_CH1
# 10       IO8        I/O         GPIO8  / Strapping Pin (Logisch 1)
# 11       IO10       I/O         GPIO10
# 12       IO11       I/O         GPIO11 / USB_D+
# 13       IO12       I/O         GPIO12 / USB_D-
# 14       IO13       I/O         GPIO13                                  BOTTOM LEFT
# 15       IO9        I/O         GPIO9  / Strapping Pin (Boot Mode)      BOTTOM RIGHT
# 16       IO18       I/O         GPIO18 / SDIO_CLK
# 17       IO19       I/O         GPIO19 / SDIO_CMD                       RELAY 
# 18       IO20       I/O         GPIO20 / SDIO_DATA0
# 19       IO21       I/O         GPIO21 / SDIO_DATA1
# 20       IO22       I/O         GPIO22 / SDIO_DATA2
# 21       IO23       I/O         GPIO23 / SDIO_DATA3
# 22       NC         -           Niet verbonden (No Connect)
# 23       IO15       I/O         GPIO15 / XTAL_32K_P
# 24       RXD0       I/O         GPIO17 / UART0 Receive (U0RXD)
# 25       TXD0       I/O         GPIO16 / UART0 Transmit (U0TXD)
# 26       IO3        I/O         GPIO3  / ADC1_CH3
# 27       IO2        I/O         GPIO2  / ADC1_CH2 / Strapping Pin
# 28       GND        Power       Ground (Massa)                          TOP RIGHT (antenna) 
# 29       GND (Pad)  Power       Centrale Ground Thermal Pad (Massa)

# ===================================================================
# * Belangrijke hardware-checks voor je PCB-layout of Code:
# - IO9 (Pin 15) moet hoog zijn bij booten voor de normale modus.
# - IO8 (Pin 10) en IO2 (Pin 27) zijn eveneens strapping pinnen.
# - IO11 en IO12 (Pin 12 & 13) zijn gereserveerd voor USB Serial/JTAG.
# - De "Keepout Zone" bij de antenne moet vrij blijven van koper!
# ===================================================================



