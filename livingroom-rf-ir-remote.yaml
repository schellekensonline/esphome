# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: livingroom-rf-ir-remote
  friendly_name: livingroom-rf-ir-remote

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    
logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
    
# web_server:
#   port: 80
   
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: livingroom-rf-i Fallback Hotspot
    password: !secret wifi_password

captive_portal:

# --- LED EN KNOP ---

# Blauwe status LED (LedLink op GPIO27)
light:
  - platform: binary
    name: "Status LED"
    output: led_output
    id: status_led

output:
  - platform: gpio
    pin: GPIO27
    id: led_output

# Fysieke knop op de behuizing (Button 1 op GPIO0)
binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true 
    
  # ==========================================
  # PLAY
  # ==========================================
  - platform: remote_receiver
    id: play_v1
    internal: true
    receiver_id: ir_rx
    pronto:
      data: "0000 006D 0021 0000 0067 0021 0013 000F 0013 000F 0013 0020 0012 0021 0035 0020 0013 000F 0013 000F 0011 0011 0012 0011 0013 000F 0012 0010 0013 0010 0013 000F 0013 000F 0013 000F 0022 0011 0013 000F 0013 000F 0012 0021 0013 000F 0013 000F 0013 000F 0013 000F 0024 0021 0013 000F 0012 0011 0012 0010 0013 000F 0024 0020 0024 000F 0013 0020 0013 03C2"

  - platform: remote_receiver
