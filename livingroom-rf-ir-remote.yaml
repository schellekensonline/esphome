# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: livingroom-rf-ir-remote
  friendly_name: livingroom-rf-ir-remote


esp32:
  board: esp32dev
  framework:
    type: esp-idf

    
logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
    
web_server:
  port: 80
   
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: livingroom-rf-i Fallback Hotspot
    password: !secret wifi_password

captive_portal:

# --- LED EN KNOP ---

# Blauwe status LED (LedLink op GPIO27)
light:
  - platform: binary
    name: "Status LED"
    output: led_output
    id: status_led

output:
  - platform: gpio
    pin: GPIO27
    id: led_output

# Fysieke knop op de behuizing (Button 1 op GPIO0)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
    name: "Fysieke Knop"

# --- RF & IR ONTVANGERS ---
remote_receiver:
  # IR Ontvanger (IRRecv op GPIO33)
  - pin:
      number: GPIO33
      inverted: true
    dump: all
    id: ir_rx

  # 433MHz RF Ontvanger (RFRecv op GPIO19)
  - pin:
      number: GPIO19
    dump: all
    tolerance: 30%    # Strakker dan 50% om foutieve Kaku-decoderingen te voorkomen
    filter: 100us     # Filtert micro-ruis van goedkope 433MHz ontvangers weg
    idle: 4ms         # Tijd tussen opeenvolgende RF-pakketjes
    id: rf_rx


# --- RF & IR ZENDERS ---
remote_transmitter:
  # IR Zender (IRSend op GPIO25)
  - pin: GPIO25
    carrier_duty_percent: 50%
    id: ir_tx

  # 433MHz RF Zender (RFSend op GPIO18)
  - pin: GPIO18
    carrier_duty_percent: 100%
    id: rf_tx
