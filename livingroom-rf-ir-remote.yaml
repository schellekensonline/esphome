# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: livingroom-rf-ir-remote
  friendly_name: livingroom-rf-ir-remote

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    
logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
    
# web_server:
#   port: 80
   
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: livingroom-rf-i Fallback Hotspot
    password: !secret wifi_password

captive_portal:

# --- LED EN KNOP ---

# Blauwe status LED (LedLink op GPIO27)
light:
  - platform: binary
    name: "Status LED"
    output: led_output
    id: status_led

output:
  - platform: gpio
    pin: GPIO27
    id: led_output

# Fysieke knop op de behuizing (Button 1 op GPIO0)
binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true 
    
  - platform: template
    name: "Media Player Play"
    id: mp_play
    filters:
      - delayed_off: 500ms # Springt na een halve seconde automatisch weer uit

  - platform: template
    name: "Media Player Pause"
    id: mp_pause
    filters:
      - delayed_off: 500ms

  - platform: template
    name: "Media Player Stop"
    id: mp_stop
    filters:
      - delayed_off: 500ms

  - platform: template
    name: "Media Player Rewind"
    id: mp_rewind
    filters:
      - delayed_off: 500ms

  - platform: template
    name: "Media Player Fast Forward"
    id: mp_fast_forward
    filters:
      - delayed_off: 500ms

  - platform: template
    name: "Media Player Previous"
    id: mp_previous
    filters:
      - delayed_off: 500ms

  - platform: template
    name: "Media Player Next"
    id: mp_next
    filters:
      - delayed_off: 500ms

  - platform: template
    name: "Media Player Channel Up"
    id: mp_ch_up
    filters:
      - delayed_off: 500ms

  - platform: template
    name: "Media Player Channel Down"
    id: mp_ch_down
    filters:
      - delayed_off: 500ms

  
    
# --- RF & IR ONTVANGERS ---
remote_receiver:
  # IR Ontvanger (IRRecv op GPIO33)
  - pin:
      number: GPIO33
      inverted: true
 #   filter: 50us
    idle: 25ms
    id: ir_rx
    dump: all
    # - pronto      # Print remote code in Pronto form. Useful for using arbitrary protocols.
    # - raw         # Print all remote codes in their raw form. Also useful for using arbitrary protocols.
    # - rc5         # Decode and dump RC5 IR codes.
    # - rc6         # Decode and dump RC6 IR codes.
    # - nec         # Decode and dump NEC infrared codes.
    # - panasonic   # Decode and dump Panasonic infrared codes.
    # - sony        # Decode and dump Sony infrared codes.
    # - samsung     # Decode and dump Samsung infrared codes.
    # - samsung36   # Decode and dump Samsung36 infrared codes.
    # - abbwelcome  # Decode and dump ABB-Welcome codes. Messages are sent via copper wires. See transmitter description for more details.
    # - aeha        # Decode and dump AEHA infrared codes.
    # - beo4        # Decode and dump B&O Beo4 infrared codes.
    # - canalsat    # Decode and dump CanalSat infrared codes.
    # - canalsatld  # Decode and dump CanalSatLD infrared codes.
    # - coolix      # Decode and dump Coolix infrared codes.
    # - dish        # Decode and dump Dish infrared codes.
    # - dyson       # Decode and dump Dyson Cool AM7 tower fan codes.
    # - jvc         # Decode and dump JVC infrared codes.
    # - gobox       # Decode and dump Go-Box infrared codes.
    # - haier       # Decode and dump Haier infrared codes.
    # - lg          # Decode and dump LG infrared codes.
    # - magiquest   # Decode and dump MagiQuest wand infrared codes.
    # - midea       # Decode and dump Midea infrared codes.
    # - nexa        # Decode and dump Nexa (RF) codes.
    # - pioneer     # Decode and dump Pioneer infrared codes.
    # - roomba      # Decode and dump Roomba infrared codes.
    # - symphony    # Decode and dump Symphony infrared codes.
    # - toshiba_ac  # Decode and dump Toshiba AC infrared codes.
    # - mirage      # Decode and dump Mirage infrared codes.
    # - toto        # Decode and dump Toto infrared codes.
    on_pronto:
      then:
        - lambda: |-
            // PLAY
            if (x.data == "0000 006D 0021 0000 0067 0021 0013 000F 0013 000F 0013 0020 0012 0021 0035 0020 0013 000F 0013 000F 0011 0011 0012 0011 0013 000F 0012 0010 0013 0010 0013 000F 0013 000F 0013 000F 0022 0011 0013 000F 0013 000F 0012 0021 0013 000F 0013 000F 0013 000F 0013 000F 0024 0021 0013 000F 0012 0011 0012 0010 0013 000F 0024 0020 0024 000F 0013 0020 0013 03C2" || 
                x.data == "0000 006D 0021 0000 0066 0022 0013 000F 0013 000F 0013 0020 0013 0020 0035 0020 0013 000F 0013 000F 0013 000F 0011 0011 0013 000F 0013 000F 0012 0010 0013 000F 0013 000F 0013 000F 0023 0010 0013 000F 0013 000F 0014 001F 0012 0010 0011 0011 0013 000F 0012 0010 0023 0021 0012 0010 0012 0010 0012 0010 0012 0010 0024 0021 0022 0011 0012 0021 0012 03C2") {
              id(mp_play).publish_state(true);
            }
            
            // PAUSE
            else if (x.data == "0000 006D 0022 0000 0066 0022 0012 0010 0013 000F 0013 0020 0013 0020 0035 0020 0013 000F 0013 000F 0012 0010 0013 0010 0012 0010 0013 000F 0013 000F 0013 0010 0012 0010 0012 0010 0023 0010 0013 0010 0013 000F 0012 0010 0012 0021 0012 0010 0012 0010 0012 0010 0023 0021 0012 0010 0012 0010 0012 0010 0011 0011 0023 0010 0012 0021 0012 0010 0012 0010 0011 03C2" || 
                     x.data == "0000 006D 0022 0000 0065 0023 0012 0010 0012 0010 0012 0021 0012 0021 0034 0021 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0022 0011 0012 0010 0012 0010 0012 0010 0012 0021 0012 0010 0012 0010 0011 0011 0023 0021 0012 0010 0012 0010 0012 0010 0012 0010 0023 0010 0012 0021 0012 0010 0011 0011 0012 03C2") {
              id(mp_pause).publish_state(true);
            }
            
            // STOP
            else if (x.data == "0000 006D 0021 0000 0067 0022 0013 000F 0012 0010 0013 0021 0013 0020 0035 0020 0013 0010 0013 000F 0012 0010 0013 000F 0012 0010 0013 0010 0012 0010 0013 000F 0013 000F 0013 000F 0023 0010 0012 0010 0012 0010 0013 0021 0013 000F 0013 000F 0013 000F 0012 0010 0024 0020 0013 0010 0013 0010 0013 000F 0013 000F 0024 000F 0013 0020 0013 000F 0024 03C2" || 
                     x.data == "0000 006D 0021 0000 0065 0023 0013 000F 0013 000F 0013 0020 0012 0021 0035 0020 0013 000F 0011 0011 0013 000F 0013 000F 0012 0010 0013 000F 0013 000F 0013 000F 0012 0010 0013 000F 0024 0010 0013 000F 0012 0010 0011 0022 0013 0010 0013 000F 0013 000F 0013 000F 0024 0020 0012 0010 0012 0010 0013 000F 0012 0010 0024 000F 0013 0021 0013 000F 0024 03C2") {
              id(mp_stop).publish_state(true);
            }
            
            // REWIND
            else if (x.data == "0000 006D 0020 0000 0067 0021 0013 000F 0013 000F 0013 0020 0013 0020 0035 0020 0013 000F 0013 0010 0013 000F 0012 0011 0013 000F 0013 000F 0013 000F 0012 0010 0012 0010 0013 000F 0023 0010 0013 0010 0012 0010 0013 000F 0013 0020 0011 0010 0013 000F 0013 000F 0022 0022 0012 0010 0013 0010 0012 0010 0012 0010 0023 0021 0024 0020 0024 03C2" || 
                     x.data == "0000 006D 0020 0000 0066 0022 0013 000F 0013 0010 0013 0020 0012 0021 0034 0021 0013 0010 0013 000F 0013 000F 0012 0010 0012 0010 0013 000F 0013 000F 0012 0010 0012 0010 0012 0010 0024 0010 0013 000F 0012 0010 0012 0010 0012 0021 0013 000F 0012 0010 0012 0010 0023 0021 0013 0010 0012 0010 0012 0010 0012 0010 0023 0021 0023 0021 0023 03C2") {
              id(mp_rewind).publish_state(true);
            }
            
            // FAST FORWARD
            else if (x.data == "0000 006D 0021 0000 0066 0022 0012 0010 0012 0010 0012 0021 0012 0021 0034 0021 0012 0010 0011 0011 0011 0011 0012 0010 0011 0011 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0023 0010 0012 0010 0012 0010 0011 0011 0011 0022 0012 0010 0012 0010 0012 0010 0023 0021 0012 0010 0012 0010 0012 0010 0011 0011 0023 0021 0023 0021 0012 0010 0011 03C2" || 
                     x.data == "0000 006D 0021 0000 0066 0022 0011 0011 0012 0010 0011 0022 0012 0021 0034 0021 0012 0010 0012 0010 0012 0010 0012 0010 0011 0011 0012 0010 0012 0010 0012 0010 0012 0010 0012 0010 0023 0010 0012 0010 0012 0010 0012 0010 0012 0021 0012 0010 0012 0010 0011 0011 0022 0022 0012 0010 0012 0010 0012 0010 0011 0011 0023 0021 0023 0021 0012 0010 0011 03C2") {
              id(mp_fast_forward).publish_state(true);
            }
            
            // PREVIOUS
            else if (x.data == "0000 006D 0021 0000 0066 0022 0012 0010 0012 0010 0013 0020 0013 0020 0034 0021 0013 0010 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0011 0011 0023 0010 0012 0010 0013 000F 0013 0020 0013 000F 0013 000F 0012 0010 0013 000F 0024 0020 0013 000F 0013 000F 0013 000F 0013 000F 0024 000F 0012 0021 0024 000F 0013 03C2" || 
                     x.data == "0000 006D 0021 0000 0065 0023 0013 000F 0012 0010 0013 0021 0013 0020 0034 0021 0013 000F 0012 0010 0012 0010 0013 0010 0013 0010 0013 0010 0013 000F 0013 000F 0013 000F 0013 000F 0024 000F 0013 000F 0013 000F 0012 0022 0013 000F 0013 000F 0013 000F 0013 000F 0024 0021 0013 000F 0013 000F 0012 0010 0012 0010 0023 0010 0012 0021 0023 0011 0013 03C2") {
              id(mp_previous).publish_state(true);
            }
            
            // NEXT
            else if (x.data == "0000 006D 0021 0000 0067 0021 0013 000F 0012 0010 0013 0020 0013 0020 0034 0021 0013 000F 0013 000F 0013 000F 0013 0010 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0014 000F 0024 000F 0013 0010 0012 0010 0013 0020 0013 000F 0011 0011 0013 000F 0013 000F 0023 0021 0013 000F 0013 000F 0012 0010 0012 0010 0024 000F 0013 0021 0024 0020 0012 03C2" || 
                     x.data == "0000 006D 0021 0000 0066 0023 0013 000F 0012 0011 0013 0020 0013 0020 0033 0022 0013 000F 0013 0010 0013 0010 0013 000F 0013 000F 0013 000F 0013 000F 0012 0010 0012 0010 0013 000F 0024 000F 0013 000F 0013 000F 0013 0020 0013 000F 0013 000F 0013 000F 0013 0010 0024 0020 0013 000F 0013 0010 0013 000F 0013 000F 0023 0010 0013 0020 0023 0021 0012 03C2") {
              id(mp_next).publish_state(true);
            }
            
            // CHANNEL UP
            else if (x.data == "0000 006D 0021 0000 0067 0021 0012 0010 0013 000F 0011 0022 0012 0021 0034 0021 0013 000F 0013 000F 0013 000F 0012 0010 0013 000F 0013 000F 0014 000E 0014 000E 0013 000F 0013 0010 0023 0010 0013 000F 0013 000F 0013 0020 0012 0010 0013 000F 0013 000F 0013 000F 0024 0020 0012 0010 0013 000F 0013 000F 0013 000F 0022 0022 0013 000F 0022 0022 0013 03C2" || 
                     x.data == "0000 006D 0021 0000 0066 0022 0012 0010 0011 0011 0013 0020 0013 0020 0035 0020 0013 000F 0013 000F 0012 0010 0013 000F 0013 000F 0013 000F 0013 000F 0013 0010 0012 0010 0013 000F 0023 0010 0012 0010 0013 000F 0013 0020 0012 0010 0013 000F 0012 0010 0013 000F 0023 0021 0012 0010 0013 000F 0013 000F 0012 0010 0024 0020 0013 000F 0024 0021 0012 03C2") {
              id(mp_ch_up).publish_state(true);
            }
            
            // CHANNEL DOWN
            else if (x.data == "0000 006D 0021 0000 0066 0022 0013 0010 0012 0010 0013 0020 0013 0020 0035 0020 0012 0010 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0011 0011 0013 000F 0022 0011 0013 000F 0013 000F 0013 0020 0013 000F 0013 000F 0013 0010 0012 0010 0024 0020 0013 000F 0013 000F 0013 000F 0013 000F 0023 0022 0013 000F 0023 0010 0013 03C2" || 
                     x.data == "0000 006D 0021 0000 0067 0022 0013 000F 0013 000F 0012 0021 0012 0021 0035 0020 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0013 000F 0024 000F 0013 0010 0013 000F 0012 0021 0012 0010 0013 000F 0013 000F 0012 0010 0023 0021 0012 0010 0013 000F 0013 000F 0012 0010 0023 0021 0013 0010 0022 0011 0012 03C2") {
              id(mp_ch_down).publish_state(true);
            }

    
  # 433MHz RF Ontvanger (RFRecv op GPIO19)
  - pin:
      number: GPIO19
    filter: 150us
    tolerance: 30%
    idle: 4ms
    id: rf_rx
  
    dump:
      # - raw           # Print all remote codes in their raw form. Also useful for using arbitrary protocols.
      - rc_switch     # Decode and dump RCSwitch RF codes.
      - brennenstuhl  # Decode and dump brennenstuhl RF codes.
      - byronsx       # Decode and dump Byron SX doorbell RF codes.
      - dooya         # Decode and dump Dooya RF codes.
      - drayton       # Decode and dump Drayton Digistat RF codes.
      - dyson         # Decode and dump Dyson Cool AM7 tower fan codes.
      - keeloq        # Decode and dump KeeLoq RF codes.
      - nexa          # Decode and dump Nexa (RF) codes.


    
# --- RF & IR ZENDERS ---
remote_transmitter:
  # IR Zender (IRSend op GPIO25)
  - pin: GPIO25
    non_blocking: true  # <-- Voeg dit toe om de waarschuwing te stoppen
    carrier_duty_percent: 50%
    id: ir_tx

  # 433MHz RF Zender (RFSend op GPIO18)
  - pin: GPIO18
    non_blocking: true  # <-- Voeg dit toe om de waarschuwing te stoppen
    carrier_duty_percent: 100%
    id: rf_tx